name: Optax MultiSteps validation
on:
  push:
    branches: [optax-multisteps-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install 'jax==0.7.1' 'jaxlib==0.7.1' 'flax==0.11.2' pytest ruff pyink -e .
          python -m pip check
          mkdir -p validation-results
          python -m pip freeze > validation-results/environment.txt
      - name: Compare baseline and correction sequentially
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, subprocess, sys, xml.etree.ElementTree as ET
          import jax
          baseline = '8589d974e565fbf1bfa1cdf8d94f5ecdf8ebe93c'
          production = Path('optax/transforms/_accumulation.py')
          tests = Path('optax/transforms/_accumulation_test.py')
          fixed = production.read_bytes()
          result_dir = Path('validation-results')
          summary = dict(started=datetime.now(timezone.utc).isoformat(),
                         baseline=baseline, head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                         python=sys.version, jax=jax.__version__, devices=[str(d) for d in jax.devices()],
                         files={str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in (production,tests)})
          def run_suite(name, selection):
              command = [sys.executable,'-m','pytest',*selection,'-q','--tb=short',
                         '--junitxml='+str(result_dir/(name+'.xml'))]
              started = datetime.now(timezone.utc).isoformat()
              process = subprocess.run(command)
              suites = ET.parse(result_dir/(name+'.xml')).getroot().findall('testsuite')
              counts = {key:sum(int(s.attrib.get(key,0)) for s in suites)
                        for key in ('tests','failures','errors','skipped')}
              counts['passed'] = counts['tests']-counts['failures']-counts['errors']-counts['skipped']
              return dict(command=command, started=started, completed=datetime.now(timezone.utc).isoformat(),
                          exit_code=process.returncode, counts=counts)
          try:
              production.write_bytes(subprocess.check_output(['git','show',baseline+':'+str(production)]))
              summary['baseline_run'] = run_suite('baseline-regressions',
                  [str(tests)+'::MultiStepsNonFiniteTest'])
          finally:
              production.write_bytes(fixed)
              (result_dir/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          before = summary['baseline_run']
          assert before['exit_code']==1 and before['counts']['failures']>0 and before['counts']['errors']==0, before
          summary['corrected_run'] = run_suite('corrected-selected-tests',
              [str(tests),'optax/transforms/_conditionality_test.py'])
          summary['completed'] = datetime.now(timezone.utc).isoformat()
          (result_dir/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2),flush=True)
          assert summary['corrected_run']['exit_code']==0, summary['corrected_run']
          assert production.read_bytes()==fixed
      - name: Lint and check source integrity
        run: |
          python -m ruff check optax/transforms/_accumulation.py optax/transforms/_accumulation_test.py
          python .github/check_license_headers.py
          git diff --exit-code
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multisteps-validation
          path: validation-results/
          retention-days: 30
